<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Attendance — Cubing Competitions</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
</head>
<body>
    <div class="container">
        <header>
            <h1>📱 NFC Attendance</h1>
            <p class="subtitle">Cubing Competition Check-in System</p>
        </header>

        <div class="cards">
            <a href="/admin.html" class="card admin">
                <div class="card-icon">⚙️</div>
                <h2>Admin Panel</h2>
                <p>Create competitions, add competitors, assign NFC tags</p>
            </a>

            <a href="/attendance.html" class="card attendance">
                <div class="card-icon">✅</div>
                <h2>General Check-in</h2>
                <p>Check-in competitors (one-time per person)</p>
            </a>

            <a href="/assign.html" class="card assign">
                <div class="card-icon">🏷️</div>
                <h2>Assign Tags</h2>
                <p>Map NFC tags to competitors</p>
            </a>
        </div>

        <div class="nfc-status" id="nfcStatus">
            <span class="status-dot"></span>
            <span class="status-text">Checking NFC support...</span>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check NFC support
        const statusEl = document.getElementById('nfcStatus');
        const dot = statusEl.querySelector('.status-dot');
        const text = statusEl.querySelector('.status-text');

        if ('NDEFReader' in window) {
            dot.classList.add('supported');
            text.textContent = 'NFC Supported — Ready to scan';
        } else {
            dot.classList.add('unsupported');
            text.textContent = 'NFC Not Supported — Use QR or Manual mode';
        }
    </script>
</body>
</html>
