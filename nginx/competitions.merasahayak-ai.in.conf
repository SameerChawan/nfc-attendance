server {
    listen 443 ssl http2;
    server_name competitions.merasahayak-ai.in;

    # SSL (Cloudflare)
    ssl_certificate /etc/nginx/ssl/merasahayak-ai.in.pem;
    ssl_certificate_key /etc/nginx/ssl/merasahayak-ai.in-key.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;

    # Proxy to Node.js
    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # File upload size
    client_max_body_size 10M;
}

# HTTP redirect
server {
    listen 80;
    server_name competitions.merasahayak-ai.in;
    return 301 https://$server_name$request_uri;
}